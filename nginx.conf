server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PDF yuklash (VITE_MAX_UPLOAD_SIZE_MB dan biroz katta, multipart overhead uchun)
    client_max_body_size 25m;

    # API: same-origin proxy. API_UPSTREAM env orqali beriladi (nginx envsubst template).
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf)$ {
        expires 7d;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
